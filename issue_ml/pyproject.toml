[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-ml"
version = "0.1.0"
description = "Reproducible Issue text classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "joblib"]

[project.scripts]
issue-ml = "issue_ml.classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
